<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>연체이자 계산기 | 법률·채권 계산기</title>
  <meta name="description" content="원금, 연이율, 시작일, 종료일을 입력하면 연체이자와 총 청구금액을 계산합니다.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-layout">
    <aside class="side-ad left"><div class="ad-label"><div>AD</div><div>광고문의</div><div class="ad-small">좌측 배너</div></div></aside>
    <main class="app">
      <header><h1>연체이자 계산기</h1><p>원금, 연이율, 시작일, 종료일을 입력하면 연체이자와 총 청구금액을 계산합니다.</p></header>
      <nav class="nav"><a class="" href="index.html">홈</a><a class="active" href="overdue-interest.html">연체이자</a><a class="" href="delay-damages.html">지연손해금</a><a class="" href="payment-order.html">지급명령</a><a class="" href="seizure-attachment.html">압류·가압류</a><a class="" href="acquisition-tax.html">취등록세</a><a class="" href="capital-gains-tax.html">양도소득세</a><a class="" href="brokerage-fee.html">중개보수</a><a class="" href="registration-cost.html">등기비용</a><a class="" href="severance-pay.html">퇴직금</a><a class="" href="annual-leave-pay.html">연차수당</a><a class="" href="weekly-holiday-pay.html">주휴수당</a><a class="" href="net-salary.html">실수령액</a></nav>
      
<section class="card"><div class="notice">법률 판단이 아닌 단순 산식 계산기입니다.</div></section>
<section class="card">
<h2 class="small-title">계산 정보 입력</h2>
<div class="grid two"><div><label>원금</label><input id="principal" inputmode="numeric" value="30,000,000"></div><div><label>이율 선택</label><select id="rateType" onchange="customRate.disabled=this.value!=='custom'"><option value="5">민사 5%</option><option value="6">상사 6%</option><option value="12">소송촉진 12%</option><option value="custom">직접 입력</option></select></div></div>
<div class="grid two" style="margin-top:12px;"><div><label>직접 입력 이율(연 %)</label><input id="customRate" inputmode="decimal" disabled></div><div><label>연 기준일수</label><select id="dayBasis"><option value="365">365일</option><option value="366">366일</option><option value="360">360일</option></select></div></div>
<div class="grid two" style="margin-top:12px;"><div><label>시작일</label><input id="startDate" type="date"></div><div><label>종료일</label><input id="endDate" type="date"></div></div>
<div class="grid two" style="margin-top:14px;"><button class="btn" onclick="calculateOverdue()">계산하기</button><button class="btn secondary" onclick="location.reload()">초기화</button></div>
</section>
<section id="resultCard" class="card result"><h2>계산 결과</h2><div class="summary"><div class="metric"><div class="name">원금</div><div id="outPrincipal" class="value">0원</div></div><div class="metric"><div class="name">연체이자</div><div id="outInterest" class="value">0원</div></div><div class="metric"><div class="name">총 청구금액</div><div id="outTotal" class="value">0원</div></div></div><div id="formulaBox" class="formula"></div><button class="btn light" style="margin-top:12px" onclick="copyOverdue()">결과 복사</button></section>

      <section class="card"><h2 class="small-title">광고 영역 예시</h2><div class="adbox">나중에 Google AdSense 광고 코드를 넣을 위치입니다.</div></section>
      <footer>법률·세금 계산기 v8.0 / GitHub Pages용 SEO 분리 버전</footer>
    </main>
    <aside class="side-ad right"><div class="ad-label"><div>AD</div><div>광고문의</div><div class="ad-small">우측 배너</div></div></aside>
  </div>
  <script src="app.js"></script>
</body>
</html>
